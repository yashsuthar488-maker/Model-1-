<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clothing Store Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(to right, #141e30, #243b55);
    }

    .login-container{
      width:350px;
      background:white;
      padding:40px;
      border-radius:12px;
      box-shadow:0 5px 15px rgba(0,0,0,0.3);
      text-align:center;
    }

    .login-container h1{
      margin-bottom:10px;
      color:#333;
    }

    .login-container p{
      margin-bottom:25px;
      color:gray;
      font-size:14px;
    }

    .input-box{
      margin-bottom:20px;
      text-align:left;
    }

    .input-box label{
      display:block;
      margin-bottom:5px;
      color:#444;
      font-weight:bold;
    }

    .input-box input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      transition:0.3s;
    }

    .input-box input:focus{
      border-color:#243b55;
    }

    .login-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#243b55;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#141e30;
    }

    .extra-links{
      margin-top:15px;
      font-size:14px;
    }

    .extra-links a{
      text-decoration:none;
      color:#243b55;
      font-weight:bold;
    }

    .brand{
      font-size:28px;
      color:#243b55;
      margin-bottom:10px;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="brand">Fashion Hub</div>

    <h1>Login</h1>
    <p>Welcome back to our clothing store</p>

    <form>

      <div class="input-box">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    <div class="extra-links">
      <p>Don't have an account? <a href="#">Register</a></p>
    </div>

  </div>

</body>
</html>
